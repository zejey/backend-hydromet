services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hydromet_db
      - DB_USER=weather_app
      - DB_PASSWORD=weather_pass
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hydromet_db
      - DB_USER=weather_app
      - DB_PASSWORD=weather_pass
    command: python scripts/seed_data.py
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=hydromet_db
      - POSTGRES_USER=weather_app
      - POSTGRES_PASSWORD=weather_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_app -d hydromet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"

volumes:
  postgres_data:
