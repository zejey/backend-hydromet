[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-api"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"